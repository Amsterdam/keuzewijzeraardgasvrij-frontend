# See https://docs.github.com/en/code-security/supply-chain-security/keeping-your-dependencies-updated-automatically
# This configuration enables Dependabot for patch and major updates only, skipping minor updates.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "all"
    ignore:
      - dependency-type: "all"
        update-types:
          - "minor"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "dependabot"
      include: "scope"
