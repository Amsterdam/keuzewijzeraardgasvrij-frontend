version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    allow:
      - dependency-type: "all"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-patch"
    open-pull-requests-limit: 100
    commit-message:
      prefix: "dependabot"
      include: "scope"
