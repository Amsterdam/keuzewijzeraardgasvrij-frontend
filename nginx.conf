events {
  worker_connections 4096;
}

http {
  include mime.types;

  server {
    server_tokens off;
    listen 8000;

    # Written by entrypoint.sh: X-Robots-Tag on non-production environments.
    include /var/cache/nginx/robots.conf;

    gzip on;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml;

    location / {

      if ($request_method != GET) {
        return 405;
      }

      gzip_static on;

      root /var/www/application;

      try_files $uri /index.html;

      location /static/ {
        expires max;
      }

      location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        # Repeated here: a location with its own add_header inherits none from above.
        include /var/cache/nginx/robots.conf;
      }
    }

    location /.well-known/security.txt {
      return 302 https://www.amsterdam.nl/.well-known/security.txt;
    }
  }
}
